---
# Action Config
- whiteboard_tag: fidefe
  bugzilla_user_id: 159069
  description: Firefox Front End whiteboard tag
  parameters:
    jira_project_key: FIDEFE
    steps:
      new:
        - create_issue
        - maybe_delete_duplicate
        - add_link_to_bugzilla
        - add_link_to_jira
        - maybe_assign_jira_user
        - maybe_update_issue_status
        - maybe_update_issue_resolution
        - maybe_update_issue_priority
        - maybe_update_issue_severity
        - maybe_update_issue_points
        - sync_whiteboard_labels
        - sync_dependencies
        - sync_see_also
      existing:
        - update_issue_summary
        - maybe_assign_jira_user
        - maybe_update_issue_status
        - maybe_update_issue_resolution
        - maybe_update_issue_priority
        - maybe_update_issue_severity
        - maybe_update_issue_points
        - sync_whiteboard_labels
        - sync_dependencies
        - sync_see_also
    labels_brackets: both
    status_map: &status-closed-map
      ASSIGNED: In Progress
      FIXED: Closed
      WONTFIX: Closed
      DUPLICATE: Closed
      INVALID: Closed
      INCOMPLETE: Closed
      WORKSFORME: Closed
      REOPENED: In Progress
    resolution_map: &basic-resolution-map
      FIXED: Done
      INVALID: Invalid
      WONTFIX: "Won't Do"
      INACTIVE: Inactive
      DUPLICATE: Duplicate
      WORKSFORME: "Cannot Reproduce"
      INCOMPLETE: Incomplete
      MOVED: Moved


- whiteboard_tag: fxp
  bugzilla_user_id: 396948
  description: Performance Team
  parameters:
    jira_project_key: FXP
    jira_components: &create-product-component
      use_bug_component: false
      use_bug_component_with_product_prefix: true
      create_components: true
    steps:
      new:
        - create_issue
        - maybe_delete_duplicate
        - add_link_to_bugzilla
        - add_link_to_jira
        - maybe_assign_jira_user
        - maybe_update_components
        - maybe_update_issue_status
        - maybe_update_issue_resolution
        - maybe_update_issue_priority
        - maybe_update_issue_severity
        - maybe_add_phabricator_link
        - sync_whiteboard_labels
        - sync_keywords_labels
        - sync_dependencies
        - sync_see_also
        - sync_regressions
      existing:
        - update_issue_summary
        - maybe_update_components
        - maybe_assign_jira_user
        - maybe_update_issue_type
        - maybe_update_issue_status
        - maybe_update_issue_resolution
        - maybe_update_issue_priority
        - maybe_update_issue_severity
        - maybe_add_phabricator_link
        - sync_whiteboard_labels
        - sync_keywords_labels
        - sync_dependencies
        - sync_see_also
        - sync_duplicates
        - sync_regressions
        - add_jira_comments_for_changes
      comment:
        - create_comment
    issue_type_map:
      task: Task
      defect: Bug
      enhancement: Improvement
    status_map: &basic-status-map
      UNCONFIRMED: Backlog
      NEW: Backlog
      ASSIGNED: In Progress
      REOPENED: In Progress
      RESOLVED: Done
      VERIFIED: Done
      FIXED: Done
      INVALID: Done
      WONTFIX: Done
      INACTIVE: Done
      DUPLICATE: Done
      WORKSFORME: Done
      INCOMPLETE: Done
      MOVED: Done
    resolution_map: *basic-resolution-map



