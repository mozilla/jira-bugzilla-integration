- whiteboard_tag: AIASST
  bugzilla_user_id: tbd
  description: AIASST inbound test
  parameters:
    jira_project_key: AIASST
    jira_inbound_enabled: true
    reverse_comment_sync_enabled: true
    resolution_map:
      FIXED: Completed
    default_reverse_resolution: FIXED
    # Only if your Jira priority names differ from P1-P5 / None.
    # BMO value -> Jira priority name:
    # priority_map:
    #   "--": "None"
    #   "P1": "Highest"
    #   "P2": "High"
    #   "P3": "Medium"
    #   "P4": "Low"
    #   "P5": "Lowest"

